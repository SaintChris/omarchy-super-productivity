name: scripts
on:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/scripts.yml"]
  pull_request:
    paths: ["scripts/**", ".github/workflows/scripts.yml"]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning scripts/*
